name: Validar

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validar:
    name: Conteúdo, lint e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24: `check:content` importa os dados em TypeScript (type stripping nativo)
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Validar conteúdo dos cases
        run: npm run check:content

      - name: Lint
        run: npm run lint

      - name: Build de produção
        run: npm run build

      - name: Verificar segredos acidentais
        run: |
          if git grep -nEI '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----|sk-[A-Za-z0-9]{20,})' -- ':!node_modules' ':!package-lock.json'; then
            echo "Segredo detectado em arquivo versionado."
            exit 1
          fi
          echo "OK: nenhum segredo detectado."
